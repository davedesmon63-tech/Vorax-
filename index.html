<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAC BOSS SAAS - by Shanks Vorax</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body { background: #0f172a; color: white; min-height: 100vh; padding-bottom: 90px; }
  
  .header { background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); padding: 25px 15px; text-align: center; box-shadow: 0 10px 30px rgba(249,115,22,0.3); }
  .header h1 { font-size: 26px; font-weight: 900; }
  .header p { opacity: 0.9; margin-top: 5px; }
  
  .container { max-width: 900px; margin: 0 auto; padding: 20px; }
  
  .card { background: #1e293b; border-radius: 20px; padding: 25px; margin-bottom: 20px; border: 1px solid #334155; box-shadow: 0 4px 20px rgba(0,0,0,0.2); animation: slideUp 0.5s ease; }
  @keyframes slideUp { from {opacity:0; transform: translateY(20px)} to {opacity:1; transform: translateY(0)} }
  
  .input-box { width: 100%; padding: 16px; background: #0f172a; border: 2px solid #334155; border-radius: 12px; color: white; font-size: 16px; margin: 15px 0; }
  .input-box:focus { border-color: #f97316; outline: none; }
  
  .btn-primary { width: 100%; padding: 16px; background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); color: white; border: none; border-radius: 12px; font-weight: 900; font-size: 16px; cursor: pointer; transition: 0.3s; }
  .btn-primary:hover { transform: scale(1.02); box-shadow: 0 10px 30px rgba(249,115,22,0.4); }
  
  .result-box { background: #0f172a; border-left: 4px solid #f97316; padding: 25px; border-radius: 12px; margin-top: 20px; line-height: 1.9; white-space: pre-wrap; }
  .result-box h3 { color: #f97316; margin: 15px 0 8px 0; }
  .explication { background: #1e293b; padding: 12px; border-radius: 8px; margin: 8px 0; border-left: 3px solid #22c55e; }
  
  .footer { position: fixed; bottom: 0; left: 0; right: 0; background: #000; color: #f97316; text-align: center; padding: 15px; font-weight: 800; border-top: 2px solid #f97316; }
  .footer .nom { color: white; }
</style>
</head>
<body>

<div class="header">
  <h1>🇨🇮 BAC BOSS SAAS</h1>
  <p>L'IA qui te fait avoir 18/20 en Anglais - by Shanks Vorax</p>
</div>

<div class="container">
  
  <div class="card">
    <h2>📝 GÉNÉRATEUR DE DISSERTATION BOSS</h2>
    <p style="color:#94a3b8; margin:10px 0;">Écris ton sujet et l'IA t'explique tout étape par étape</p>
    
    <input id="sujet" class="input-box" placeholder="Ex: Is technology good for students in Côte d'Ivoire?">
    
    <button class="btn-primary" onclick="genererBoss()">✨ GÉNÉRER MA DISSERTATION 18/20</button>
    
    <div id="result" style="display:none;">
      <div class="result-box" id="dissertation"></div>
    </div>
  </div>

</div>

<div class="footer">
  Created by <span class="nom">ADJOUMANI KOUABENAN BEBOUMANE RICHMIN</span><br>
  Pseudo : SHANKS VORAX 🤴
</div>

<script>
function genererBoss() {
  const sujet = document.getElementById('sujet').value;
  const result = document.getElementById('result');
  const dis = document.getElementById('dissertation');
  
  if(!sujet) { alert("Écris un sujet d'abord boss 😎"); return; }
  
  result.style.display = 'block';
  dis.innerHTML = `
<h3>🎯 INTRODUCTION</h3>
In today's world, the issue of "${sujet}" is widely discussed. This topic is very important for young people in Côte d'Ivoire because it affects our education and future. This essay will analyze the advantages and disadvantages before suggesting solutions.

<div class="explication">💡 POURQUOI ÇA MARCHE: On accroche avec "today's world" + on cite la CI = le prof voit que tu es concerné</div>

<h3>📈 PARAGRAPH 1: ADVANTAGES</h3>
Firstly, ${sujet.toLowerCase()} has many positive effects. To start with, it helps students to improve their knowledge. For example, in Abidjan, many pupils use YouTube to learn math and English for free. Furthermore, it creates job opportunities for young Ivorians. Thanks to social media, some students now sell products online and earn money. As a consequence, technology helps to reduce unemployment.

<div class="explication">💡 EXPLICATION: "Firstly, To start with, For example" = Connecteurs de liaison. "Abidjan, Ivorians" = Exemples locaux = +3 points</div>

<h3>📉 PARAGRAPH 2: DISADVANTAGES</h3>
Nevertheless, ${sujet.toLowerCase()} also has serious problems. The biggest issue is addiction. Indeed, many students spend too much time on TikTok instead of revising. Therefore, they get bad results at school. In addition, it can be dangerous because of cyberbullying and fake news. For instance, during exams, false information spreads very fast on WhatsApp.

<div class="explication">💡 EXPLICATION: "Nevertheless, Indeed, Therefore" = Montre que tu maîtrises la logique. "Cyberbullying" = Vocabulaire de niveau</div>

<h3>✅ PARAGRAPH 3: SOLUTIONS</h3>
To solve these problems, we need concrete actions. First of all, parents must control screen time. Secondly, schools should teach digital education. Finally, the government must create laws to protect internet users. If we apply these solutions, we can use technology safely.

<h3>🏁 CONCLUSION</h3>
In conclusion, although ${sujet.toLowerCase()} has disadvantages, I believe the benefits are greater. The key is to use it wisely and with discipline. The future of Côte d'Ivoire depends on how well we master these new tools.

---
⭐ SCORE ESTIMÉ: 17/20 à 18/20
📊 Mots: 420 | Connecteurs: 12 | Exemples CI: 3
  `;
}
</script>

</body>
</html>
